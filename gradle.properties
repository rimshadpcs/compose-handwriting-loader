org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true

# Compose Multiplatform's iOS targets are Kotlin/Native; enabling the new memory model /
# k2 defaults that the rest of this toolchain version expects.
kotlin.native.ignoreDisabledTargets=true

GROUP=com.rimshadpcs.composehandwriting
VERSION_NAME=0.1.0

POM_NAME=Compose Handwriting Loader
POM_DESCRIPTION=An animated handwriting/text-reveal loading indicator for Compose Multiplatform (Android + iOS), with a configurable font, size, color and duration.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/rimshadpcs/compose-handwriting-loader

POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/rimshadpcs/compose-handwriting-loader
POM_SCM_CONNECTION=scm:git:git://github.com/rimshadpcs/compose-handwriting-loader.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/rimshadpcs/compose-handwriting-loader.git

